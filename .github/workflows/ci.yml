name: Java CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Smoke-test executable JAR
        run: java -jar target/kakuro-generator-1.0.0.jar --help
